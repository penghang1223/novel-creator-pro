            - generic [ref=e1732]: 坏消息：和美女姐姐一夜风流。 好消息：她不粘人，天亮就跑路。 更坏的消息：第二天上班，发现她竟是自己的美女上司，还是自己亲小姨的闺蜜！ 上班第一天，夏知颜就踩着高跟鞋，把苏然堵在墙角：“苏然，昨晚的事，你敢说出去，就让你滚蛋！” 殊不知，苏然反手将她压在办公桌上：“夏总监，昨晚你在床上可不是这么说的。” 本以为是职场死局，没想到情况渐渐不对劲，成了办公室地下情！ 人前，夏知颜是高冷禁欲的夏总监，把苏然当狗一样使唤。 人后，苏然却捏着夏知颜的把柄，让她在办公室里乖乖听话。 “夏总监，您也不想我们昨晚的事，被小姨知道吧？” 直到数月后，苏然当着全公司上千人的面，抱着娃上台：“介绍一下，这是我的孩子，苏念夏！”
