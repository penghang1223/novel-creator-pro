            - generic [ref=e1702]: 季家实在是流年不利，父兄接连失踪，阿姐昏迷不醒。 季木桃成了家中顶梁柱。 为给阿姐冲喜，看脸的季木桃斥巨资十五两买下重伤美男子。 无奈家中病患太多，季木桃撸起袖子开饭馆，哐哐挣钱养家。 俊姐夫成了饭店伙计，生意一日日红火起来。 连温润如玉的县令大人都成了常客。 可季木桃不懂？ 为何姐夫的脸色一日比一日黑，小嘴跟淬了毒似的。 阿姐终于醒了！！ 季木桃决定和阿姐一起进京调查父亲信中真相。 可怜的姐夫被抛弃了。 半年后，盛京宴席上，再次相遇。 什么！！！ 身价十五两的姐夫竟是当朝太子！！！ —— 贺休禁锢住季木桃双腕，眼神游离 “姐夫？谁是你姐夫！当初同孤拜堂的是你！”
