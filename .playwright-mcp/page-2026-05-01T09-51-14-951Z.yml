            - generic [ref=e1717]: 京北空军总部最年轻的少将周偃沉，一直顺风顺水，一次任务让他再也无法站起来。 所有人都嘲笑他，天上的雄鹰再也飞不起来了，下半辈子陪伴他的不再是战机，而是轮椅。 在他心灰意冷之际，家里突然来了一对母子，孩子调皮捣蛋，孩子妈也没好到哪里去，这哪里是请的保姆，分明是请来了一对祖宗！ 后来，这两人还真成了他的祖宗。 —— 所有人都说陆烟行为不检点，未婚生子不说还勾三搭四，为了留在城里，抢了弟弟的工作，把家人捅进医院，是个不好惹的主儿。 陆烟忽然空降军区大院照顾周偃沉，本想拿着五倍的工资，安安生生做个保姆，谁成想成了香饽饽。 周偃沉的弟弟是她的迷弟，为她冲锋陷阵。 周偃沉的妹妹为了她跟好姐妹决裂。 大院有个传闻，谁要是欺负周偃沉，陆烟就把谁打的妈都不认识。 周偃沉的死对头说，他这辈子别想站起来了，一辈子离不开陆烟这个小保姆。 后来，周偃沉重新站起来了，陆烟带着孩子离开大院，一向沉稳的周偃沉拉着她的手，“烟烟，我们结婚吧。”
